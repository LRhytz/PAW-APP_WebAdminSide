<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pet Details</title>
  <link rel="stylesheet" href="css/adoption.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
  />
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="js/config.js"></script>
</head>

<body>
  <!-- Header -->
  <header class="app-header">
    <button class="back-btn" onclick="history.back()">
      <i class="fas fa-arrow-left"></i>
    </button>
    <div class="app-title">Pet Details</div>
    <div class="header-actions">
      <button class="action-btn" id="share-btn"><i class="fas fa-share-alt"></i></button>
    </div>
  </header>

  <!-- Main content -->
  <main class="main-content">
    <div id="loading-spinner" class="loading-container">
      <div class="spinner"></div>
      <p>Loading pet details...</p>
    </div>

    <div id="pet-details-container" class="pet-details-container"></div>

    <div id="error-container" class="error-container" style="display:none;">
      <i class="fas fa-exclamation-circle"></i>
      <h3>Oops!</h3>
      <p id="error-message"></p>
      <button class="btn-primary" onclick="location.reload()">Try Again</button>
    </div>
  </main>

  <!-- Action bar -->
  <div class="adoption-action-bar" id="adoption-actions" style="display:none;">
    <button class="action-btn favorite-btn" id="favorite-btn">
      <i class="far fa-heart"></i>
      <span>Save</span>
    </button>
    <button class="action-btn share-btn" id="mobile-share-btn">
      <i class="fas fa-share-alt"></i>
      <span>Share</span>
    </button>
    <button class="btn-primary adopt-btn" id="adopt-btn">
      <i class="fas fa-paw"></i>
      <span>Adopt Me</span>
    </button>
  </div>

  <!-- External JS -->
  <script src="js/adoptionDetails.js"></script>
</body>
</html>
